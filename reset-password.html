<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-600 min-h-screen flex items-center justify-center p-4">


    <div class="w-full max-w-md">
        <p class="text-white font-bold mb-4 text-center text-xl">RED PRODUCT</p>

        <form class="bg-white rounded-lg p-6 flex flex-col gap-4 w-full">
            <p class="font-semibold text-gray-700">Nouveau mot de passe</p>

            <div class="border-b pb-2">
                <input type="password" id="password" placeholder="Nouveau mot de passe" class="w-full outline-none p-1">
            </div>

            <div class="border-b pb-2">
                <input type="password" id="confirm" placeholder="Confirmer le mot de passe"
                    class="w-full outline-none p-1">
            </div>

            <p id="message" class="text-sm"></p>

            <button onclick="resetPassword()" type="button"
                class="bg-gray-700 text-white p-3 rounded-lg w-full hover:bg-gray-800">
                Réinitialiser
            </button>
        </form>
    </div>

    <script src="api.js"></script>
    <script src="reset-password.js"></script>
</body>



</html>
